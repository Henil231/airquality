# Local infra: PostGIS, single node Kafka, and Airflow.
# Host Spark (pip install pyspark) drives the streaming lane.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: air
      POSTGRES_PASSWORD: air
      POSTGRES_DB: air
    ports: ["5432:5432"]

  kafka:
    image: apache/kafka:3.8.0
    # INTERNAL is for other containers (kafka:9092), HOST is for the laptop (localhost:29092).
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on: [db]
    env_file: .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Data source keys, read from .env. Empty by default so the synthetic feed still works keyless.
      OPENAQ_KEY: ${OPENAQ_KEY:-}
      AIRNOW_KEY: ${AIRNOW_KEY:-}
      PURPLEAIR_KEY: ${PURPLEAIR_KEY:-}
    ports: ["8080:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    command: standalone

  # Live dashboard. Reuses the airflow image (it already has psycopg2).
  web:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on: [db]
    environment:
      PG_DSN: postgresql://air:air@db:5432/air
    ports: ["8050:8050"]
    volumes:
      - ./:/opt/airflow/project
    working_dir: /opt/airflow/project
    entrypoint: ["python", "web/server.py"]
